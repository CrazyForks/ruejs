[package]
name = "rue-ssr-binary-demo"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
desktop-webview = ["dep:tao", "dep:wry"]

[[bin]]
name = "rue-ssr-binary-demo"
path = "src/main.rs"

[[bin]]
name = "rue-ssr-binary-demo-desktop"
path = "src/desktop.rs"
required-features = ["desktop-webview"]

[dependencies]
axum = "0.8"
deno_core = "0.403.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["net", "rt", "rt-multi-thread"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34", optional = true }
wry = { version = "0.54", optional = true }
